# Daily Workflow 1 — `illustrated_slides`: Topic Research -> Outline -> Expanded Content -> AI Illustrations & D2 Diagram -> Keynote HTML + PPTX + PDF.
#
#   yanshi workflow run examples/generators/illustrated_slides.yml \
#     --input subject "Rust 异步运行时 Tokio 调度器与工作窃取原理" --output-dir out
name: illustrated_slides
description: "根据主题联网搜集资料、规划 PPT 大纲、按讲解风格扩写内容，自动生成精美插图与 D2 架构图，输出交互式 HTML 演示、可编辑 PPTX 与 PDF 讲义"

inputs:
  subject:
    description: "PPT 演讲主题"
    default: "Rust 异步运行时 Tokio 调度器与工作窃取原理"
  audience:
    description: "目标听众群体"
    default: "后端研发工程师与系统架构师"
  narration_style:
    description: "讲解风格与表达基调（如深入浅出、工程实战、学术严谨、产品路演）"
    default: "深入浅出、类比直观、结合真实高并发工程案例"
  slide_count:
    description: "幻灯片章节页数（4-10）"
    default: 6
  slide_theme:
    description: "幻灯片视觉配色主题：'dark' 或 'light'"
    default: "dark"
  visual_style:
    description: "AI 插图统一艺术风格提示词（英文描述效果最佳，禁含文字）"
    default: "modern clean flat editorial technology illustration, subtle isometric depth, harmonious sapphire and warm amber palette, crisp studio lighting, no text, no letters, no watermark"
  enable_illustrations:
    description: "是否调用文生图模型生成定制精美插图（设为 false 时仅使用 D2 矢量架构图与结构化面板）"
    default: true
  image_model:
    description: "文生图模型名称（需在 models.yml 配置对应厂商密钥）"
    default: "gemini-3.1-flash-image"
  image_size:
    description: "生成插图尺寸"
    default: "1536x1024"
  export_pptx:
    description: "导出可编辑 PowerPoint (.pptx)"
    default: true
  export_pdf:
    description: "导出高清排版讲义 (.pdf)"
    default: true

nodes:
  - id: search_query
    type: template
    parameters:
      template: "{{ subject }} 核心原理 架构设计 关键指标 最佳实践"

  - id: research
    type: web_search
    dependencies: ["search_query"]
    input_mapping:
      query: "{{ nodes.search_query.outputs.output }}"
    parameters:
      max_results: 6

  - id: outline_prompt
    type: template
    dependencies: ["research"]
    input_mapping:
      search_notes: "{{ nodes.research.outputs.markdown }}"
    parameters:
      template: |
        你是一位兼具系统深度与视觉审美力的首席演讲策划师。请围绕主题「{{ subject }}」，面向「{{ audience }}」，按照「{{ narration_style }}」的讲解方式，规划一份共 {{ slide_count }} 页的精品 PPT 大纲。

        大纲规划要求：
        1. 叙事弧线清晰：第 1 页破题立意与痛点引入，中间页层层递进拆解核心架构/机制/工程权衡，最后 1 页给出落地最佳实践总结。
        2. 为每一页明确规划右侧视觉呈现模式 `visual_mode`：
           - `"illustration"`：适合概念隐喻、开篇引入、场景故事或总结升华页（预计安排 2-3 页），需提供精确的英文纯视觉画面描述 `illustration_prompt`（严禁出现任何文字、字母、标语）；
           - `"arch_diagram"`：全套课件安排恰好 1 页最核心的系统架构或数据流机制页，由 D2 编译器绘制高精度工程矢量架构图；
           - `"structured_panel"`：其余硬核拆解页使用双栏工程可视化对照（代码批注、对比矩阵表格、内存布局或思维导图）。
        3. 充分利用以下联网检索到的背景资料与真实技术细节支撑论点：

        {{ search_notes | truncate(length=14000) }}

  - id: plan_outline
    type: llm
    dependencies: ["outline_prompt"]
    input_mapping:
      prompt: "{{ nodes.outline_prompt.outputs.output }}"
    parameters:
      max_tokens: 8192
      system: "你是严谨的 PPT 大纲架构师，仅输出符合 JSON Schema 的有效 JSON。"
      json_schema:
        type: object
        required: [title, subtitle, arch_diagram_spec, chapters]
        properties:
          title: { type: string }
          subtitle: { type: string }
          arch_diagram_spec:
            type: string
            description: "核心架构/机制页的 D2 图详细绘制说明（指明分层容器、核心组件与有向调用边）"
          chapters:
            type: array
            minItems: 3
            maxItems: 12
            items:
              type: object
              required: [section, title, key_points, narration_angle, visual_mode]
              properties:
                section: { type: string }
                title: { type: string }
                key_points:
                  type: array
                  items: { type: string }
                narration_angle: { type: string }
                visual_mode:
                  type: string
                  enum: [illustration, arch_diagram, structured_panel]
                illustration_prompt: { type: string }

  - id: arch_figure_desc
    type: template
    dependencies: ["plan_outline"]
    input_mapping:
      outline: "{{ nodes.plan_outline.outputs.output }}"
    parameters:
      template: |
        为主题「{{ outline.title }}」绘制一张清晰、美观的 D2 系统架构与核心机制图（direction: right，合理使用嵌套容器、语义节点标签与简短有向边说明，控制在 8-14 个核心节点内，避免杂乱交叉）：
        {{ outline.arch_diagram_spec }}

  - id: arch_figure
    type: figure
    dependencies: ["arch_figure_desc"]
    input_mapping:
      description: "{{ nodes.arch_figure_desc.outputs.output }}"
    parameters:
      language: d2
      png: true
      png_width: 1600
      max_attempts: 4

  - id: expand_prompt
    type: template
    dependencies: ["plan_outline", "research"]
    input_mapping:
      outline: "{{ nodes.plan_outline.outputs.output }}"
      search_notes: "{{ nodes.research.outputs.markdown }}"
    parameters:
      template: |
        请基于以下已确认的 PPT 大纲与检索资料，将每一章扩写为完整、可直接渲染的结构化幻灯片内容（目标听众：{{ audience }}；讲解方式：{{ narration_style }}；配色主题：{{ slide_theme }}）。

        填充规范（极其重要）：
        1. 保持与大纲完全一致的页数与章节顺序，每页必须包含：
           - `section`（如 "01 痛点破局"）、`title`、`subtitle`
           - `left`：左侧主内容面板，必须符合 `SlideDeck` 面板结构之一：
             * `{"kind": "bullets", "title": "...", "grid": false, "items": [{"badge": "核心", "heading": "...", "body": "...", "tone": "accent"}]}`（每页 3-4 条干货要点，避免空话）
             * `{"kind": "code", "title": "...", "language": "rust", "code": "...", "callouts": [{"line": 3, "text": "...", "tone": "cyan"}]}`（8-14 行精炼代码）
             * `{"kind": "table", "title": "...", "highlight_col": 1, "columns": [...], "rows": [[...]]}`
             * `{"kind": "flowchart", "title": "...", "direction": "TB", "nodes": [{"id": "n1", "label": "..."}], "edges": [{"from": "n1", "to": "n2", "label": "..."}]}`
           - `fallback_right`：右侧结构化备选面板（同样使用 `bullets` / `table` / `code` / `flowchart` / `mindmap` 之一；当该页为 `structured_panel` 或未启用文生图时直接展示在右栏）。
           - `visual_mode`：保持大纲设定的 `"illustration"` / `"arch_diagram"` / `"structured_panel"`。
           - `illustration_prompt`：若 `visual_mode == "illustration"`，给出 1-2 句精细英文画面提示词（纯视觉构图与隐喻物体，严禁文字与字母）及一句简短中文图注 `illustration_caption`。
           - `notes`：3-4 句贴合「{{ narration_style }}」的完整讲师口播逐字稿。
           - `takeaway`：页面底部一句凝练的工程结论。

        已确认大纲 JSON：
        {{ outline | json_encode() }}

        参考检索资料：
        {{ search_notes | truncate(length=10000) }}

  - id: expand_slides
    type: llm
    dependencies: ["expand_prompt"]
    input_mapping:
      prompt: "{{ nodes.expand_prompt.outputs.output }}"
    parameters:
      max_tokens: 16384
      system: "你是资深演示文稿内容主笔，严格输出符合 SlideDeck 扩写 Schema 的合法 JSON。"
      json_schema:
        type: object
        required: [title, slides]
        properties:
          title: { type: string }
          subtitle: { type: string }
          author: { type: string }
          slides:
            type: array
            minItems: 3
            maxItems: 12
            items:
              type: object
              required: [title, left, fallback_right, visual_mode, notes, takeaway]
              properties:
                section: { type: string }
                title: { type: string }
                subtitle: { type: string }
                left: { type: object }
                fallback_right: { type: object }
                visual_mode: { type: string }
                illustration_prompt: { type: string }
                illustration_caption: { type: string }
                takeaway: { type: string }
                notes: { type: string }

  - id: illustration_jobs
    type: template
    dependencies: ["expand_slides"]
    input_mapping:
      draft: "{{ nodes.expand_slides.outputs.output }}"
    parameters:
      output_format: json
      template: |
        {"items": [{% if enable_illustrations %}{% set_global first = true %}{% set_global count = 0 %}{% for s in draft.slides %}{% if s.visual_mode == "illustration" and s.illustration_prompt and count < 4 %}{% if not first %},{% endif %}{% set_global first = false %}{% set_global count = count + 1 %}{% set full_prompt = s.illustration_prompt ~ ". Visual style: " ~ visual_style %}{"slide_index": {{ loop.index0 }}, "visual": {{ full_prompt | json_encode() }}, "caption": {{ s.illustration_caption | default(value=s.title) | json_encode() }}, "image_model": {{ image_model | json_encode() }}, "image_size": {{ image_size | json_encode() }}}{% endif %}{% endfor %}{% endif %}]}

  - id: illustrations
    type: map
    dependencies: ["illustration_jobs"]
    input_mapping:
      input_list: "{{ nodes.illustration_jobs.outputs.items }}"
    parameters:
      parallel: true
      max_concurrent: 3
      template:
        - id: paint
          type: text_to_image
          input_mapping:
            visual: "{{ item.visual }}"
            model: "{{ item.image_model }}"
            size: "{{ item.image_size }}"
          parameters:
            prompt: "{{visual}}"

  - id: final_deck_spec
    type: template
    dependencies: ["expand_slides", "arch_figure", "illustration_jobs", "illustrations"]
    input_mapping:
      draft: "{{ nodes.expand_slides.outputs.output }}"
      arch_png: "{{ nodes.arch_figure.outputs.arch_figure_png }}"
      jobs: "{{ nodes.illustration_jobs.outputs.items }}"
      painted: "{{ nodes.illustrations.outputs.results }}"
    parameters:
      output_format: json
      template: |
        {
          "title": {{ draft.title | json_encode() }},
          "subtitle": {{ draft.subtitle | default(value="") | json_encode() }},
          "author": {{ draft.author | default(value="Yanshi Studio") | json_encode() }},
          "theme": {{ slide_theme | json_encode() }},
          "slides": [
            {% for s in draft.slides %}{% set idx = loop.index0 %}{% set_global img_src = "" %}{% set_global img_title = "" %}{% set_global img_cap = "" %}{% if s.visual_mode == "arch_diagram" and arch_png %}{% set_global img_src = arch_png %}{% set_global img_title = "系统核心架构图 (D2)" %}{% set_global img_cap = s.title %}{% else %}{% for j in jobs %}{% if j.slide_index == idx %}{% set r = painted | nth(n=loop.index0) %}{% if r.paint and r.paint.Ok %}{% set_global img_src = r.paint.Ok.paint_image.path %}{% set_global img_title = "主题概念插图" %}{% set_global img_cap = j.caption %}{% endif %}{% endif %}{% endfor %}{% endif %}{
              "section": {{ s.section | default(value="") | json_encode() }},
              "title": {{ s.title | json_encode() }},
              "subtitle": {{ s.subtitle | default(value="") | json_encode() }},
              "left": {{ s.left | json_encode() }},
              "right": {% if img_src != "" %}{"kind": "image", "title": {{ img_title | json_encode() }}, "src": {{ img_src | json_encode() }}, "caption": {{ img_cap | json_encode() }}}{% else %}{{ s.fallback_right | json_encode() }}{% endif %},
              "split_ratio": 0.52,
              "takeaway": {{ s.takeaway | json_encode() }},
              "notes": {{ s.notes | json_encode() }}
            }{% if not loop.last %},{% endif %}{% endfor %}
          ]
        }

  - id: slides_render
    type: render_slides
    dependencies: ["final_deck_spec"]
    input_mapping:
      deck: "{{ nodes.final_deck_spec.outputs.output }}"
    parameters:
      width: 1920
      progressive: false

  - id: export_flags
    type: template
    parameters:
      output_format: json
      template: '{"pptx": {{ export_pptx }}, "pdf": {{ export_pdf }}}'

  - id: deck_pptx
    type: render_document
    dependencies: ["slides_render", "export_flags"]
    run_if: "{{ nodes.export_flags.outputs.pptx }}"
    input_mapping:
      markdown: "{{ nodes.slides_render.outputs.slides_render_markdown }}"
    parameters:
      format: pptx

  - id: deck_pdf
    type: render_document
    dependencies: ["slides_render", "export_flags"]
    run_if: "{{ nodes.export_flags.outputs.pdf }}"
    input_mapping:
      markdown: "{{ nodes.slides_render.outputs.slides_render_markdown }}"
    parameters:
      format: pdf

  - id: deliverable
    type: template
    dependencies: ["final_deck_spec", "slides_render", "arch_figure", "deck_pptx", "deck_pdf"]
    input_mapping:
      deck: "{{ nodes.final_deck_spec.outputs.output }}"
      html: "{{ nodes.slides_render.outputs.slides_render_html }}"
      arch_svg: "{{ nodes.arch_figure.outputs.arch_figure_svg }}"
      pptx: "{{ nodes.deck_pptx.outputs.deck_pptx_output }}"
      pdf: "{{ nodes.deck_pdf.outputs.deck_pdf_output }}"
    parameters:
      output_format: json
      template: |
        {"deliverable": {
          "kind": "illustrated_slides",
          "title": {{ deck.title | json_encode() }},
          "content": {"slides": {{ deck.slides | json_encode() }}},
          "citations": [],
          "files": [
            {"node_id": "slides_render", "name": {{ html | split(pat="/") | last | json_encode() }}, "mime_type": "text/html", "role": "preview"},
            {"node_id": "arch_figure", "name": {{ arch_svg | split(pat="/") | last | json_encode() }}, "mime_type": "image/svg+xml", "role": "asset"}{% if pptx %},
            {"node_id": "deck_pptx", "name": {{ pptx | split(pat="/") | last | json_encode() }}, "mime_type": "application/vnd.openxmlformats-officedocument.presentationml.presentation", "role": "primary"}{% endif %}{% if pdf %},
            {"node_id": "deck_pdf", "name": {{ pdf | split(pat="/") | last | json_encode() }}, "mime_type": "application/pdf", "role": "primary"}{% endif %}
          ]
        }}
