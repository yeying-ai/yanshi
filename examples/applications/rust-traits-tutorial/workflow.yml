# Rust Traits Multimodal Course Generator (YAML Workflow)
#
# End-to-end multimodal DAG workflow demonstrating Yanshi's production
# LLM + Text-to-Image + Image-to-Video (I2V) + TTS + FFmpeg video rendering:
#   1. Structured 6-chapter curriculum via `llm` (`json_schema`)
#   2. Per-chapter parallel `map`:
#      - 16:9 architectural illustration (`text_to_image`)
#      - First-frame anchored 6s video clip (`text_to_video` with `image`) on
#        core mechanism chapters (`moving == true`)
#      - Chinese narration voiceover (`tts`, RIFF/WAV)
#   3. Narrated full-course MP4 + SRT subtitle track (`render_video`)
#   4. Illustrated Markdown + HTML study guide (`render_markdown`)
#
# Validate:
#   yanshi workflow validate examples/applications/rust-traits-tutorial/workflow.yml --strict
#
# Run live (with GEMINI_API_KEY set and ffmpeg installed):
#   yanshi workflow run examples/applications/rust-traits-tutorial/workflow.yml \
#     --output-dir runs/rust-traits-workflow
name: rust_traits_tutorial
description: "Multimodal course generator on Rust Traits: 6 illustrated chapters, selected Veo I2V animations, TTS voice-over, subtitled MP4, and Markdown/HTML study guide"

inputs:
  topic:
    description: "Course subject and mandatory structural outline"
    default: "Rust Traits 深度讲解：1.介绍（共享行为契约与Typeclass本质） 2.描述方式（方法签名、默认实现、关联类型 vs 泛型参数、Supertraits） 3.应用方法（Trait Bounds、编译期单态化静态分发 vs 胖指针 dyn vtable 动态分发、Blanket Impl） 4.核心优点（深度对比 OOP 类继承体系与 C 语言 void* 函数指针） 5.注意事项（孤儿规则 Orphan Rule、对象安全 dyn 兼容性、单态化代码膨胀与过早抽象反模式） 6.总结与工程哲学深思"
  model:
    description: "Chat model used to author the structured 6-chapter script"
    default: "gemini-4-hydrogen"
  image_model:
    description: "Text-to-image model for 16:9 chapter illustrations"
    default: "gemini-3.1-flash-image"
  image_size:
    description: "Aspect ratio or resolution for chapter illustrations"
    default: "16:9"
  video_model:
    description: "Image-to-video model for moving mechanism chapters; leave empty for stills only"
    default: "veo-3.1-fast-generate-001"
  video_seconds:
    description: "Duration in seconds for each Veo I2V clip"
    default: 6
  tts_model:
    description: "Text-to-speech model for Chinese chapter narration"
    default: "gemini-2.5-flash-preview-tts"
  voice:
    description: "Prebuilt TTS voice name"
    default: "Kore"
  style:
    description: "Shared visual art direction across all 6 chapter illustrations"
    default: "dark slate systems-engineering architectural blueprint illustration, glowing copper-orange and cyan energy conduits, crisp isometric geometry, cinematic 16:9 lighting, no text or letters"
  burn_subtitles:
    description: "Burn subtitles into video frames (requires ffmpeg with libass); false embeds a toggleable soft subtitle track + .srt"
    default: false

nodes:
  - id: curriculum_prompt
    type: template
    parameters:
      template: |
        请围绕以下主题设计一套严谨、深入骨髓的 6 章技术课程脚本（中文撰写正文与旁白，英文撰写视觉与运镜提示词）：
        主题：{{ topic }}

        硬性要求：
        1. 严格包含 6 个章节（介绍、描述方式、应用方法、对比 OOP 与 C 语言的优势、实战注意事项、总结与深思）。
        2. 每章必须提供：
           - `heading`: 章节标题
           - `markdown`: 详实的中文技术讲解（含 2 空格缩进的精炼 Rust / C / OOP 对比代码示例与底层机制剖析）
           - `narration`: 适合语音播报的中文讲解词（3~4 句口语化但精准的核心提炼，不含代码块或舞台指示）
           - `visual`: 一句英文画面描述，用于生成 16:9 概念架构插图（严禁包含任何文字或字母）
           - `motion_prompt`: 一句英文运镜与动态粒子流描述，用于基于首帧图生成 6 秒动态视频
           - `motion`: 布尔值。仅在第 3 章（静态单态化 vs 动态 vtable）、第 4 章（对比 OOP 与 C void*）和第 6 章（编译期契约工程哲学）设为 `true`，其余章节设为 `false`。

  - id: curriculum
    type: llm
    dependencies: ["curriculum_prompt"]
    input_mapping:
      prompt: "{{ nodes.curriculum_prompt.outputs.output }}"
    parameters:
      system: "你是资深 Rust 编译器与系统架构专家。仅输出符合 schema 的严格 JSON。"
      max_tokens: 16384
      json_schema:
        type: object
        required: [title, summary, chapters]
        properties:
          title: { type: string }
          summary: { type: string }
          chapters:
            type: array
            minItems: 6
            maxItems: 6
            items:
              type: object
              required: [heading, markdown, narration, visual, motion_prompt, motion]
              properties:
                heading: { type: string }
                markdown: { type: string }
                narration: { type: string }
                visual: { type: string }
                motion_prompt: { type: string }
                motion: { type: boolean }

  - id: shots
    type: template
    dependencies: ["curriculum"]
    input_mapping:
      plan: "{{ nodes.curriculum.outputs.output }}"
    parameters:
      output_format: json
      template: |
        {"items": [{% for c in plan.chapters %}{% set visual = c.visual ~ ". Style: " ~ style ~ "." %}{"visual": {{ visual | json_encode() }}, "motion_prompt": {{ c.motion_prompt | json_encode() }}, "narration": {{ c.narration | json_encode() }}, "image_model": {{ image_model | json_encode() }}, "image_size": {{ image_size | json_encode() }}, "tts_model": {{ tts_model | json_encode() }}, "voice": {{ voice | json_encode() }}, "moving": {% if c.motion and video_model %}true{% else %}false{% endif %}, "video_model": {{ video_model | json_encode() }}, "video_seconds": {{ video_seconds | json_encode() }}}{% if not loop.last %},{% endif %}{% endfor %}]}

  - id: produce
    type: map
    dependencies: ["shots"]
    input_mapping:
      input_list: "{{ nodes.shots.outputs.items }}"
    parameters:
      parallel: true
      max_concurrent: 2
      template:
        - id: mode
          type: template
          input_mapping:
            moving: "{{ item.moving }}"
          parameters:
            output_format: json
            template: '{"moving": {{ moving }}}'
        - id: picture
          type: text_to_image
          input_mapping:
            visual: "{{ item.visual }}"
            model: "{{ item.image_model }}"
            size: "{{ item.image_size }}"
          parameters:
            prompt: "{{visual}}"
        - id: clip
          type: text_to_video
          dependencies: ["mode", "picture"]
          run_if: "{{ nodes.mode.outputs.moving }}"
          input_mapping:
            motion_prompt: "{{ item.motion_prompt }}"
            model: "{{ item.video_model }}"
            duration_seconds: "{{ item.video_seconds }}"
            image: "{{ nodes.picture.outputs.picture_image.path }}"
          parameters:
            prompt: "{{motion_prompt}}"
            aspect_ratio: "16:9"
        - id: say
          type: tts
          input_mapping:
            input_template: "{{ item.narration }}"
            voice: "{{ item.voice }}"
            model: "{{ item.tts_model }}"

  - id: cut
    type: template
    dependencies: ["produce"]
    input_mapping:
      plan: "{{ nodes.curriculum.outputs.output }}"
      made: "{{ nodes.produce.outputs.results }}"
    parameters:
      output_format: json
      template: |
        {"scenes": [{% for r in made %}{% set c = plan.chapters | nth(n=loop.index0) %}{"audio": {{ r.say.Ok.say_output.path | json_encode() }}, "caption": {{ c.narration | json_encode() }}, {% if r.clip.Ok %}"video": {{ r.clip.Ok.clip_video.path | json_encode() }}{% else %}"image": {{ r.picture.Ok.picture_image.path | json_encode() }}{% endif %}}{% if not loop.last %},{% endif %}{% endfor %}]}

  - id: film
    type: render_video
    dependencies: ["cut"]
    input_mapping:
      scenes: "{{ nodes.cut.outputs.scenes }}"

  - id: assemble_md
    type: template
    dependencies: ["curriculum", "produce", "film"]
    input_mapping:
      plan: "{{ nodes.curriculum.outputs.output }}"
      made: "{{ nodes.produce.outputs.results }}"
      mp4: "{{ nodes.film.outputs.film_output }}"
      srt: "{{ nodes.film.outputs.film_subtitles }}"
    parameters:
      template: |
        # {{ plan.title }}

        > {{ plan.summary }}
        >
        > - **完整配音字幕讲解视频**：`{{ mp4 }}`
        > - **外挂字幕轨 (SRT)**：`{{ srt }}`

        ---
        {% for c in plan.chapters %}{% set r = made | nth(n=loop.index0) %}
        ## {{ loop.index }}. {{ c.heading }}

        ![{{ c.heading }}]({{ r.picture.Ok.picture_image.path }})
        {% if r.clip.Ok %}
        > 🎬 **本章动态机制演示视频 (Veo I2V)**：`{{ r.clip.Ok.clip_video.path }}`
        {% endif %}
        > 🎙️ **本章语音导读**：{{ c.narration }}

        {{ c.markdown }}

        ---
        {% endfor %}

  - id: tutorial_md
    type: render_markdown
    dependencies: ["assemble_md"]
    input_mapping:
      markdown: "{{ nodes.assemble_md.outputs.output }}"
    parameters:
      format: md

  - id: tutorial_html
    type: render_markdown
    dependencies: ["assemble_md"]
    input_mapping:
      markdown: "{{ nodes.assemble_md.outputs.output }}"
