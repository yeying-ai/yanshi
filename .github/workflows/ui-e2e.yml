name: UI E2E (Playwright · Dioxus)

# Browser-based smoke & lifecycle suite against a real yanshi-server + Postgres
# serving the Dioxus 0.7 WASM frontend (`yanshi-ui-dx/dist/public`) at `/ui/*`
# under strict zero-eval CSP.
#
# Pattern mirrors `llm-live.yml`: `workflow_dispatch` + nightly `schedule`,
# and **not** wired into `quality.yml::release-gate` so browser/infra flakiness
# does not block PRs.

on:
  workflow_dispatch:
    inputs:
      spec_filter:
        description: "Optional Playwright -g pattern; empty = all specs"
        required: false
        default: ""
  schedule:
    # 10:30 UTC daily ≈ 03:30 PT / 18:30 CST.
    - cron: "30 10 * * *"

jobs:
  e2e:
    name: ui-dx e2e (chromium against live server)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: yanshi
          POSTGRES_PASSWORD: yanshi
          POSTGRES_DB: yanshi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yanshi -d yanshi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://yanshi:yanshi@localhost:5432/yanshi
      YANSHI_DATABASE_TEST_URL: postgres://yanshi:yanshi@localhost:5432/yanshi
      YANSHI_SECURITY_PROFILE: local
      YANSHI_GATEWAY_PATH_ROOTS: /tmp
      YANSHI_MODELS_CONFIG: /tmp/yanshi-ui-e2e-models.yml
      YANSHI_MOCK_RESPONSE: '{"title":"E2E Tidal Study","items":[{"front":"What drives Severn Bore?","back":"Equinoctial spring tides.","question":"What drives Severn Bore?","options":["Wind","Equinoctial spring tides","Glaciers"],"answer":1,"explanation":"Equinoctial spring tides."}]}'
      E2E_MOCK_MODEL: e2e-mock
      BASE_URL: http://127.0.0.1:8080
      DX_CLI_VERSION: "0.7.10"
      TAILWIND_VERSION: "v4.1.18"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
            yanshi-ui-dx/target
          key: ${{ runner.os }}-cargo-ui-dx-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ui-dx-e2e-

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dx CLI (v0.7.10) & build Dioxus WASM UI bundle
        run: |
          curl -fsSL --retry 3 \
            "https://github.com/DioxusLabs/dioxus/releases/download/v${DX_CLI_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz" \
            -o /tmp/dx.tar.gz
          mkdir -p /tmp/dx-extract
          tar -xzf /tmp/dx.tar.gz -C /tmp/dx-extract
          dx_bin="$(find /tmp/dx-extract -type f -name dx | head -n 1)"
          sudo install -m 0755 "${dx_bin}" /usr/local/bin/dx
          rm -rf /tmp/dx.tar.gz /tmp/dx-extract
          DX_BASE_PATH="ui" ./yanshi-ui-dx/scripts/build.sh
          test -s yanshi-ui-dx/dist/public/index.html

      - name: Build yanshi-server (release)
        run: cargo build --release -p yanshi-server --bin yanshi-server

      - name: Setup node (Playwright runner only)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright + Chromium
        working-directory: yanshi-ui-dx/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Boot yanshi-server in background
        env:
          YANSHI_UI_DIR: ${{ github.workspace }}/yanshi-ui-dx/dist/public
        run: |
          cat > /tmp/yanshi-ui-e2e-models.yml <<'EOF'
          models:
            e2e-mock:
              vendor: mock
              type: text
              model_id: e2e-mock
          providers:
            mock:
              api_key_env: MOCK_API_KEY
          EOF
          ./target/release/yanshi-server &
          echo "YANSHI_SERVER_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/ui/studio > /dev/null; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to come up within 30s"
          exit 1

      - name: Run Playwright e2e
        working-directory: yanshi-ui-dx/e2e
        env:
          CI: "1"
          SPEC_FILTER: ${{ github.event.inputs.spec_filter }}
        run: |
          if [ -n "${SPEC_FILTER:-}" ]; then
            npx playwright test -g "${SPEC_FILTER}"
          else
            npx playwright test
          fi

      - name: Stop yanshi-server
        if: always()
        run: |
          if [ -n "${YANSHI_SERVER_PID:-}" ]; then
            kill "${YANSHI_SERVER_PID}" 2>/dev/null || true
          fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-dx-report-${{ github.run_id }}
          path: |
            yanshi-ui-dx/e2e/playwright-report
            yanshi-ui-dx/e2e/playwright-results.xml
            yanshi-ui-dx/e2e/test-results
          retention-days: 14
          if-no-files-found: ignore
