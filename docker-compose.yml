name: yanshi

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: yanshi-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yanshi}
      POSTGRES_USER: ${POSTGRES_USER:-yanshi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yanshi}
      POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yanshi} -d ${POSTGRES_DB:-yanshi}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - yanshi-net

  yanshi-server:
    build:
      context: .
      args:
        PACKAGE: yanshi-server
        BIN: yanshi-server
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-2}
    image: yanshi-server:local
    container_name: yanshi-server
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-yanshi}:${POSTGRES_PASSWORD:-yanshi}@postgres:5432/${POSTGRES_DB:-yanshi}
      PORT: "3000"
      RUST_LOG: ${RUST_LOG:-info}
      # U1.2: YANSHI_SECURITY_PROFILE defaults to `local` when unset.
      # Production overrides this to `production` in docker-compose.prod.yml.
      YANSHI_SECURITY_PROFILE: ${YANSHI_SECURITY_PROFILE:-local}
      # V3.1: bearer auth for /v1/* routes. Replace placeholder in production!
      YANSHI_API_TOKEN: ${YANSHI_API_TOKEN:-local-dev-change-me}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - yanshi-net

networks:
  yanshi-net:
    driver: bridge

volumes:
  postgres-data:
