models:
  # 2026-11-20: DeepSeek's live `/models` catalog serves `deepseek-flash`
  # (`DeepSeek-V4.1-Flash`, 1M context window, 384K max output tokens,
  # `input_modalities: [text, image]`) and `deepseek-v4-pro` (1M context
  # window, 384K max output tokens, text input), plus `/v1/tools/tts` and
  # `/v1/tools/asr` speech endpoints under the same `DEEPSEEK_API_KEY`.
