[package]
name = "yanshi-studio-desktop"
version = "0.1.0"
description = "Cross-platform Tauri v2 shell for Yanshi Studio & One-Click App Runner"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "yanshi_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "yanshi-studio"
path = "src/main.rs"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.7"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
dirs = "5.0"
dotenvy = "0.15"
futures = "0.3"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1.35", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7.11", features = ["io"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2.5"
uuid = { version = "1.6", features = ["v4", "serde"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
yanshi-agent-spi = { path = "../../yanshi-agent-spi" }
yanshi-agents = { path = "../../yanshi-agents" }
yanshi-config = { path = "../../yanshi-config" }
yanshi-core = { path = "../../yanshi-core" }
yanshi-harness = { path = "../../yanshi-harness" }
yanshi-llm = { path = "../../yanshi-llm" }
yanshi-memory = { path = "../../yanshi-memory" }
yanshi-notebook = { path = "../../yanshi-notebook" }
yanshi-rag = { path = "../../yanshi-rag", default-features = false, features = ["html", "pdf"] }
yanshi-skills = { path = "../../yanshi-skills" }
yanshi-tools = { path = "../../yanshi-tools" }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tempfile = "3"
