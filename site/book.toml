# Yanshi manual + landing site. Build the full GitHub Pages bundle locally with
# `python3 site/build.py` (landing page in site/book/, manual in
# site/book/docs/) or preview the manual alone with `mdbook serve site`; CI
# publishes site/book/ via .github/workflows/docs.yml.

[book]
title = "Yanshi Manual"
description = "User and operator manual for Yanshi, a multimodal content-production runtime in Rust built on deterministic DAG workflows and agent-native loops."
language = "en"
# Pages are written to be read on GitHub too, so they stay in docs/; the table
# of contents is docs/SUMMARY.md.
src = "../docs"

[build]
build-dir = "book/docs"
# A typo in SUMMARY.md must fail the build, not silently create an empty page.
create-missing = false

[preprocessor.repo-links]
command = "python3 repo_links.py"

[output.html]
site-url = "/yanshi/docs/"
git-repository-url = "https://github.com/yeying-ai/yanshi"
edit-url-template = "https://github.com/yeying-ai/yanshi/edit/main/docs/{path}"
