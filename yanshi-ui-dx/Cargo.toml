[package]
name = "yanshi-ui-dx"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Phase 0 Dioxus 0.7 + dioxus-shadcn 0.7.0 web spike for Yanshi Studio"

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
dioxus-shadcn = { version = "0.7", default-features = false, features = [
  "alert",
  "badge",
  "button",
  "card",
  "combobox",
  "dialog",
  "input",
  "label",
  "resizable",
  "separator",
  "sheet",
  "tabs",
  "textarea",
  "theme-controller",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AbortController",
  "AbortSignal",
  "Blob",
  "BlobPropertyBag",
  "Headers",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "TextDecoder",
  "Url",
  "Window",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
