[package]
name = "yanshi-ui-dx"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Yanshi Studio Dioxus 0.7 + dioxus-shadcn 0.8 web frontend"

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
dioxus-shadcn = { version = "0.8", default-features = false, features = [
  "alert",
  "badge",
  "button",
  "card",
  "checkbox",
  "combobox",
  "dialog",
  "input",
  "label",
  "native-select",
  "progress",
  "resizable",
  "separator",
  "sheet",
  "table",
  "tabs",
  "textarea",
  "theme-controller",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AbortController",
  "AbortSignal",
  "Blob",
  "BlobPropertyBag",
  "Document",
  "Element",
  "File",
  "FileList",
  "Headers",
  "History",
  "HtmlAnchorElement",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "Location",
  "Node",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Storage",
  "TextDecoder",
  "Url",
  "Window",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
